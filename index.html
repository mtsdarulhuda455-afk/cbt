      // Prevent "Cannot set property fetch of #<Window> which has only a getter"

            }, true);

            var origFetch = typeof window.fetch === 'function' ? window.fetch.bind(window) : null;
            var currentFetch = origFetch;

            try {
              if (typeof Window !== 'undefined' && Window.prototype) {
                var protoDesc = Object.getOwnPropertyDescriptor(Window.prototype, 'fetch');
                if (protoDesc && !protoDesc.set && protoDesc.configurable) {
                  Object.defineProperty(Window.prototype, 'fetch', {
                    get: function() { return currentFetch || origFetch; },
                    set: function(v) { currentFetch = v; },
                    configurable: true,
                    enumerable: true
                  });
                }
              }
            } catch (e1) {}

            try {
              Object.defineProperty(window, 'fetch', {
